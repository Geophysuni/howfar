<!DOCTYPE html>
<html lang="en">
<head>
    <title>How Far Did I Run?</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-4 sidebar">
                <h1>How Far Did I Run?</h1>
                <p>Mark your starting point and enter your total distance</p>
                <div class="mb-3">
                    <label for="distance" class="form-label">Distance (km):</label>
                    <input type="number" class="form-control" id="distance" min="0" step="0.1" value="5">
                </div>
                <button id="clear" class="btn btn-danger">Clear Map</button>
                <div class="mt-3 info">
                    <p>Distance: <span id="current-distance">5</span> km</p>
                    <p>Buffer area: <span id="area">0</span> km²</p>
                    <p id="equator-stats" class="text-muted"></p>
                    <div id="planet-too-small" class="alert alert-warning d-none">
                        <strong>Wow!</strong> Our planet is too small to contain your awesomeness! 🌍✨
                    </div>
                    <div id="cities-list" class="mt-3 d-none">
                        <h5>Cities in your range:</h5>
                        <ul id="cities" class="list-group"></ul>
                    </div>
                    <div id="loader" class="text-center mt-3 d-none">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="mt-2">Loading cities...</p>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div id="map"></div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
